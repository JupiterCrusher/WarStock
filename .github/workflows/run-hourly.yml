name: Collect News and Update Signals Hourly

on:
  schedule:
    - cron: '0 * * * *'     # runs every hour (UTC)
  workflow_dispatch:         # allows manual testing

permissions:
  contents: write

concurrency:
  group: hourly-news
  cancel-in-progress: false

jobs:
  run-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Archive news and update signal outputs
        working-directory: backend
        run: python main.py

      - name: Commit and push updated scores
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add backend/scores.json backend/errors.json backend/news.json backend/data/articles.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update signals and news archive [skip ci]"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
